services:
  hiro:
    image: ghcr.io/biggboss-glitch/hirosocialgovernance:latest
    # Mirror for faster pulling if needed
    # image: ghcr.nju.edu.cn/biggboss-glitch/hirosocialgovernance:latest
    container_name: hiro
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
